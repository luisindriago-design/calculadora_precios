<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Calculadora de Precios</title>

  <!-- Manifest inline mediante Data URI para instalación PWA -->
  <link rel="manifest" id="manifest-placeholder">
  <link rel="manifest" href="./manifest.json">
  <style>
    /* VARIABLES Y ESTILOS DE TEMA (Reemplazo local de Tailwind) */
    :root {
      --bg-main: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.8);
      --bg-input: #0f172a;
      --border-card: rgba(51, 65, 85, 0.8);
      --border-input: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary-green: #10b981;
      --primary-green-hover: #059669;
      --accent-blue: #3b82f6;
      --accent-purple: #9333ea;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1rem;
      max-width: 28rem;
      margin: 0 auto;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input {
      user-select: text;
    }

    /* HEADER */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-top: 0.5rem;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .icon-box {
      background-color: rgba(16, 185, 129, 0.2);
      color: var(--primary-green);
      padding: 0.5rem;
      border-radius: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-title {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .header-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* BOTÓN INSTALAR */
    .btn-install {
      background-color: var(--primary-green);
      color: #022c22;
      font-weight: 700;
      padding: 0.375rem 0.75rem;
      border-radius: 0.75rem;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.375rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .7; }
    }

    /* BANNER DE AYUDA */
    .pwa-banner {
      background-color: #1e293b;
      border: 1px solid #334155;
      padding: 0.75rem;
      border-radius: 1rem;
      margin-bottom: 1rem;
      font-size: 0.75rem;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pwa-banner-content {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-close {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.25rem;
    }

    /* TARJETAS FORMULARIO */
    main {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      flex: 1;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-card);
      padding: 1rem;
      border-radius: 1rem;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      transition: all 0.2s;
    }

    .card-label-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.375rem;
    }

    .label-text {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-wrapper {
      position: relative;
    }

    .input-field {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border-input);
      color: var(--text-main);
      font-size: 1.25rem;
      font-weight: 700;
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: var(--primary-green);
    }

    .input-field.blue-focus:focus {
      border-color: var(--accent-blue);
    }

    .input-field.purple-focus:focus {
      border-color: var(--accent-purple);
    }

    .input-prefix {
      position: absolute;
      left: 0.75rem;
      top: 0.85rem;
      color: #64748b;
      font-weight: 700;
    }

    .input-suffix {
      position: absolute;
      right: 0.75rem;
      top: 0.85rem;
      color: #64748b;
      font-weight: 700;
      font-size: 0.875rem;
    }

    .card-info {
      font-size: 0.6875rem;
      color: var(--text-muted);
      margin-top: 0.375rem;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    /* BOTÓN REDONDEO */
    .btn-badge {
      font-size: 0.625rem;
      background-color: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
      padding: 0.125rem 0.5rem;
      border-radius: 0.375rem;
      border: none;
      cursor: pointer;
    }

    .btn-badge-amber {
      background-color: rgba(245, 158, 11, 0.2);
      color: #fde68a;
    }

    /* SWITCH CUSTOM EN CSS */
    .switch-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }

    .switch-status {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .switch-status.active {
      color: var(--accent-purple);
    }

    .switch-bg {
      position: relative;
      width: 2.75rem;
      height: 1.5rem;
      background-color: #334155;
      border-radius: 9999px;
      transition: background-color 0.2s;
    }

    .switch-bg::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 1.25rem;
      height: 1.25rem;
      background-color: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .switch-input:checked + .switch-bg {
      background-color: var(--accent-purple);
    }

    .switch-input:checked + .switch-bg::after {
      transform: translateX(1.25rem);
    }

    .disabled-input {
      opacity: 0.5;
      cursor: not-allowed;
      color: #64748b !important;
    }

    /* CONTENEDOR RESULTADOS */
    .results-card {
      background: linear-gradient(135deg, rgba(6, 78, 59, 0.4) 0%, #1e293b 100%);
      border: 2px solid rgba(16, 185, 129, 0.5);
      padding: 1rem;
      border-radius: 1rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .total-input {
      background-color: rgba(2, 6, 23, 0.8);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
      font-size: 1.875rem;
      font-weight: 800;
      cursor: default;
    }

    .results-divider {
      padding-top: 0.5rem;
      border-top: 1px solid rgba(51, 65, 85, 0.6);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bs-amount {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .bs-symbol {
      font-size: 0.875rem;
      font-weight: 400;
      color: var(--text-muted);
    }

    .btn-reset {
      background-color: #334155;
      color: #e2e8f0;
      padding: 0.75rem;
      border-radius: 0.75rem;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-reset:active {
      transform: scale(0.95);
    }

    .hidden {
      display: none !important;
    }

    footer {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
      padding: 0.5rem 0;
    }

    svg {
      display: inline-block;
      vertical-align: middle;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-logo">
      <div class="icon-box">
        <!-- Icono Calculadora SVG -->
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="14"/><line x1="12" y1="14" x2="12" y2="14"/><line x1="8" y1="14" x2="8" y2="14"/><line x1="16" y1="18" x2="16" y2="18"/><line x1="12" y1="18" x2="12" y2="18"/><line x1="8" y1="18" x2="8" y2="18"/></svg>
      </div>
      <div>
        <h1 class="header-title">Precios Express</h1>
        <p class="header-subtitle">Calculadora de Precios (BCV-$) </p>
      </div>
    </div>
    
    <!-- Botón para instalar PWA -->
    <button id="installBtn" class="btn-install hidden">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>Instalar App</span>
    </button>
  </header>

  <!-- BANNER PWA HINT -->
  <div id="pwaHelpBanner" class="pwa-banner hidden">
    <div class="pwa-banner-content">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
      <span>Agrega a la pantalla de inicio desde el menú de tu navegador.</span>
    </div>
    <button onclick="document.getElementById('pwaHelpBanner').classList.add('hidden')" class="btn-close">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <!-- CAJAS DE TEXTO Y FORMULARIO -->
  <main>

    <!-- CAJA 1: Costo del Producto ($) -->
    <div class="card">
      <label for="costoUsd" class="label-text" style="margin-bottom:0.375rem;">
        1. Costo del producto ($)
      </label>
      <div class="input-wrapper">
        <input 
          type="number" 
          id="costoUsd" 
          step="any"
          inputmode="decimal"
          placeholder="0.00" 
          class="input-field"
          style="padding-left: 2rem;"
        >
        <span class="input-prefix">$</span>
      </div>
    </div>

    <!-- CAJA 2: Tasa del Dólar BCV (Math.ceil automático + Editable) -->
    <div class="card">
      <div class="card-label-container">
        <label for="tasaBcv" class="label-text">
          2. Dólar BCV (Redondeado)
        </label>
        <button id="toggleCeilBtn" class="btn-badge">
          Redondeo Activo (Ceil)
        </button>
      </div>
      <div class="input-wrapper">
        <input 
          type="number" 
          id="tasaBcv" 
          step="any"
          inputmode="decimal"
          placeholder="Ej: 881" 
          class="input-field blue-focus"
          style="padding-left: 2.5rem;"
        >
        <span class="input-prefix" style="font-size:0.875rem;">Bs.</span>
      </div>
      <p class="card-info">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        <span>Ej: 880.01 se eleva a 881. Puedes editar el valor.</span>
      </p>
    </div>

    <!-- CAJA 3: Ventas en Gramos (g) + Checkbox -->
    <div class="card" id="gramosCard">
      <div class="card-label-container">
        <label for="gramos" class="label-text">
          3. Venta en Gramos (g)
        </label>
        <label class="switch-label">
          <span class="switch-status" id="gramosStatusText">Desactivado</span>
          <input type="checkbox" id="checkGramos" class="switch-input" style="display:none;">
          <div class="switch-bg"></div>
        </label>
      </div>
      <div class="input-wrapper">
        <input 
          type="number" 
          id="gramos" 
          step="any"
          inputmode="decimal"
          placeholder="Ej: 250 (gramos)" 
          disabled
          class="input-field purple-focus disabled-input"
          style="padding-right: 2rem;"
        >
        <span class="input-suffix">g</span>
      </div>
      <p class="card-info">
        * Actívalo si la Caja 1 corresponde al precio por kilo (1000g).
      </p>
    </div>

    <!-- RESULTADOS Y CAJA 4 -->
    <div class="results-card">
      
      <!-- CAJA 4: Total Dólares ($) -->
      <div>
        <label for="totalUsd" class="label-text" style="color:#34d399; margin-bottom:0.25rem;">
          4. Total en Dólares ($)
        </label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="totalUsd" 
            readonly 
            value="0.00"
            class="input-field total-input"
            style="padding-left: 2.25rem;"
          >
          <span class="input-prefix" style="color:#10b981; font-size:1.5rem; top:0.75rem;">$</span>
        </div>
      </div>

      <!-- Total en Bolívares (Bs.) -->
      <div class="results-divider">
        <div>
          <span class="label-text">Total en Bolívares</span>
          <div class="bs-amount" id="totalBs">
            0,00 <span class="bs-symbol">Bs.</span>
          </div>
        </div>
        <button id="resetBtn" class="btn-reset" title="Limpiar datos">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </button>
      </div>

    </div>

  </main>

  <footer>
    Calculadora De Precios
  </footer>

  <!-- LÓGICA JAVASCRIPT & PWA LOCAL -->
  <script>
    // Manifest PWA incrustado
    const manifestData = {
      name: "Calculadora de Precios",
      short_name: "Precios",
      start_url: "./",
      display: "standalone",
      background_color: "#0f172a",
      theme_color: "#10b981",
      icons: [
        {
          src: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='%2310b981'><rect width='512' height='512' rx='100' fill='%230f172a'/><path d='M140 100h232a40 40 0 0 1 40 40v232a40 40 0 0 1-40 40H140a40 40 0 0 1-40-40V140a40 40 0 0 1 40-40z' fill='%231e293b' stroke='%2310b981' stroke-width='20'/><circle cx='180' cy='200' r='25' fill='%2310b981'/><circle cx='256' cy='200' r='25' fill='%2310b981'/><circle cx='332' cy='200' r='25' fill='%2310b981'/><circle cx='180' cy='280' r='25' fill='%233b82f6'/><circle cx='256' cy='280' r='25' fill='%233b82f6'/><circle cx='332' cy='280' r='25' fill='%233b82f6'/></svg>",
          sizes: "512x512",
          type: "image/svg+xml"
        }
      ]
    };
    const stringManifest = JSON.stringify(manifestData);
    const blobManifest = new Blob([stringManifest], {type: 'application/json'});
    document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(blobManifest));

    // Elementos DOM
    const costoUsdInput = document.getElementById('costoUsd');
    const tasaBcvInput = document.getElementById('tasaBcv');
    const checkGramos = document.getElementById('checkGramos');
    const gramosInput = document.getElementById('gramos');
    const gramosStatusText = document.getElementById('gramosStatusText');
    const totalUsdInput = document.getElementById('totalUsd');
    const totalBsElement = document.getElementById('totalBs');
    const resetBtn = document.getElementById('resetBtn');
    const toggleCeilBtn = document.getElementById('toggleCeilBtn');

    let autoCeil = true; // Aplica Math.ceil automáticamente

    // Cargar tasa persistente de localStorage al iniciar
    window.addEventListener('DOMContentLoaded', () => {
      const savedTasa = localStorage.getItem('precios_tasa_bcv');
      if (savedTasa) {
        tasaBcvInput.value = savedTasa;
      }
      calcular();
    });

    // Función de redondeo a favor (Math.ceil)
    function aplicarRedondeoBcv(valor) {
      if (!valor || isNaN(valor)) return '';
      const num = parseFloat(valor);
      return Math.ceil(num);
    }

    // Input Tasa BCV
    tasaBcvInput.addEventListener('input', (e) => {
      let val = e.target.value;
      if (val && autoCeil) {
        const valorNumerico = parseFloat(val);
        if (!isNaN(valorNumerico) && valorNumerico > 0) {
          const redondeado = Math.ceil(valorNumerico);
          if (val.includes('.') && val.split('.')[1].length > 0 && val.split('.')[1] !== '0') {
             tasaBcvInput.value = redondeado;
          }
        }
      }
      if (tasaBcvInput.value) {
        localStorage.setItem('precios_tasa_bcv', tasaBcvInput.value);
      }
      calcular();
    });

    // Botón alternar modo de redondeo
    toggleCeilBtn.addEventListener('click', () => {
      autoCeil = !autoCeil;
      if (autoCeil) {
        toggleCeilBtn.innerText = "Redondeo Activo (Ceil)";
        toggleCeilBtn.className = "btn-badge";
        if (tasaBcvInput.value) {
          tasaBcvInput.value = aplicarRedondeoBcv(tasaBcvInput.value);
          calcular();
        }
      } else {
        toggleCeilBtn.innerText = "Redondeo Libre";
        toggleCeilBtn.className = "btn-badge btn-badge-amber";
      }
    });

    // Checkbox Gramos
    checkGramos.addEventListener('change', (e) => {
      const activo = e.target.checked;
      gramosInput.disabled = !activo;
      
      if (activo) {
        gramosStatusText.innerText = "Activado";
        gramosStatusText.classList.add('active');
        gramosInput.classList.remove('disabled-input');
        gramosInput.focus();
      } else {
        gramosStatusText.innerText = "Desactivado";
        gramosStatusText.classList.remove('active');
        gramosInput.classList.add('disabled-input');
        gramosInput.value = '';
      }
      calcular();
    });

    costoUsdInput.addEventListener('input', calcular);
    gramosInput.addEventListener('input', calcular);

    // Función principal de cálculo
    function calcular() {
      const costoUsd = parseFloat(costoUsdInput.value) || 0;
      const tasaBcv = parseFloat(tasaBcvInput.value) || 0;
      const usaGramos = checkGramos.checked;
      const gramos = parseFloat(gramosInput.value) || 0;

      let totalDolares = 0;

      if (usaGramos) {
        if (gramos > 0) {
          totalDolares = (costoUsd / 1000) * gramos;
        } else {
          totalDolares = 0;
        }
      } else {
        totalDolares = costoUsd;
      }

      totalUsdInput.value = totalDolares.toFixed(2);

      const totalBolivares = totalDolares * tasaBcv;

      const bsFormateado = totalBolivares.toLocaleString('es-VE', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

      totalBsElement.innerHTML = `${bsFormateado} <span class="bs-symbol">Bs.</span>`;
    }

    // Botón Limpiar
    resetBtn.addEventListener('click', () => {
      costoUsdInput.value = '';
      gramosInput.value = '';
      if (checkGramos.checked) {
        checkGramos.checked = false;
        checkGramos.dispatchEvent(new Event('change'));
      }
      calcular();
      costoUsdInput.focus();
    });

    // ===============================================
    // SERVICE WORKER LOCAL & OFFLINE STORAGE (BLOB)
    // ===============================================
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    const pwaHelpBanner = document.getElementById('pwaHelpBanner');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.classList.remove('hidden');
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.classList.add('hidden');
      }
      deferredPrompt = null;
    });

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches;

    if (isIOS && !isStandalone) {
      pwaHelpBanner.classList.remove('hidden');
    }

    // Registro de Service Worker Autónomo sin archivo externo
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'precios-express-v1';
        self.addEventListener('install', (e) => {
          self.skipWaiting();
        });
        self.addEventListener('activate', (e) => {
          e.waitUntil(clients.claim());
        });
        self.addEventListener('fetch', (e) => {
          e.respondWith(
            fetch(e.request).catch(() => {
              return caches.match(e.request);
            })
          );
        });
      `;
      const blobSW = new Blob([swCode], {type: 'application/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(blobSW))
        .catch(err => console.log('SW Offline listo'));
    }
  </script>
</body>
</html>
